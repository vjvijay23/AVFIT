<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Satin Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181B20" />
      <stop offset="50%" stop-color="#0F1115" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <!-- Electric Cyan to Royal Blue Athletic Gradient -->
    <linearGradient id="electricBlueGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38E1FF" />
      <stop offset="45%" stop-color="#00A6FF" />
      <stop offset="100%" stop-color="#005BFF" />
    </linearGradient>

    <!-- Subtle Blue Ambient Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00A6FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Squircle Icon Tile Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#23272F" stroke-width="4" />

  <!-- The Official AVFIT Electric Slash Monogram Emblem -->
  <g transform="translate(100, 100)" filter="url(#cyanGlow)">
    
    <!-- Left Major Ascender ('A' Outer Arch and Foot) -->
    <path
      d="M 28 220 
         L 62 220 
         L 132 50 
         C 138 36, 152 36, 160 50 
         L 178 86 
         L 125 152 
         C 105 178, 88 198, 68 214 
         L 28 220 Z"
      fill="url(#electricBlueGrad)"
    />

    <!-- Inner 'A' Counter / Triangular Window -->
    <path
      d="M 125 105 
         L 146 64 
         L 162 105 
         L 125 105 Z"
      fill="#0F1115"
    />

    <!-- Upper Right Diagonal Blade of 'V' -->
    <path
      d="M 198 88 
         L 225 40 
         C 229 32, 237 32, 246 32 
         L 272 32 
         L 230 114 
         C 224 116, 212 118, 198 120 
         L 198 88 Z"
      fill="url(#electricBlueGrad)"
    />

    <!-- Dynamic Slicing Speed Crescent (Cutting Across) -->
    <path
      d="M 72 172 
         C 120 148, 185 118, 240 106 
         C 230 116, 215 125, 198 132 
         C 152 150, 105 165, 72 172 Z"
      fill="#6BE8FF"
    />

    <!-- Lower Right Descending Wedge of 'V' -->
    <path
      d="M 172 142 
         L 204 220 
         C 200 220, 192 216, 186 206 
         L 155 154 
         C 162 149, 167 145, 172 142 Z"
      fill="url(#electricBlueGrad)"
    />

  </g>
</svg>
