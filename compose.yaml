services:
  postgres:
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: avfit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - avfit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avfit_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6.7-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - avfit_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  avfit_postgres_data:
  avfit_redis_data:
