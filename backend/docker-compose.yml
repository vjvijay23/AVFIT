services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: avfit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: avfit_db
    ports:
      - "5433:5432"
    volumes:
      - avfit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: avfit_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - avfit_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  avfit_pgdata:
  avfit_redisdata:
