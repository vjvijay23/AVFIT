name: Bug Report
description: File a bug report to help improve FitPulse mobile app
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill in the details below.
  - type: input
    id: device
    attributes:
      label: Device & OS
      description: e.g. Samsung Galaxy S23 (Android 14) / iPhone 14 (iOS 17)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe what you did leading to the issue.
      placeholder: |
        1. Open Dashboard tab
        2. Tap on 'Scan Food' button
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred?
    validations:
      required: true
