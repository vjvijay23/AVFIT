services:
  - type: keyvalue
    name: avfit-redis
    plan: free
    ipAllowList: []

  - type: web
    name: avfit-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OTP_PROVIDER
        value: msg91
      - key: DATABASE_URL
        fromDatabase:
          name: avfit-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: avfit-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: MSG91_AUTHKEY
        sync: false

databases:
  - name: avfit-postgres
    plan: free
    databaseName: avfit_db
    user: avfit_user
